# Where AI Pulse looks for news.
#
# Each [[source]] is one feed or API. Fields:
#   id         stable snake_case id (changing it re-ingests the feed as new)
#   name       display name
#   url        RSS/Atom feed URL, or API endpoint for the special kinds
#   kind       feed (RSS/Atom, default) | hn | hf_papers | hf_trending
#   category   labs | research | opensource | analysis | news | community | events
#   weight     1-5: how much this source counts toward ranking
#              (5 = primary source for major announcements)
#   include / exclude   optional case-insensitive regexes on titles
#   max_age_days        ignore entries older than this (default 21)
#   enabled    set false to mute a source without deleting it
#
# Check every source with:  uv run news-bot sources

